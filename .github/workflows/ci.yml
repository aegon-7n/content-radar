name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck + build
        run: npm run build
        env:
          DATABASE_URL: postgresql://ci@localhost:5432/ci
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: ci-secret
          ADMIN_EMAIL: ci@example.com
          ADMIN_PASSWORD: ci

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install scraper deps
        run: pip install -r scraper/requirements.txt

      - name: Syntax check all scraper modules
        run: python -m compileall scraper

  deploy:
    needs: [build, python]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to production
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          # Write SSH key
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no root@$DEPLOY_HOST"

          # Sync code (excluding local-only files)
          rsync -azP --delete \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='.env*' \
            --exclude='scraper/venv' \
            --exclude='__pycache__' \
            --exclude='.git' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            ./ "root@$DEPLOY_HOST:/root/content-radar/"

          # Build and restart
          $SSH 'cd /root/content-radar && \
            npm ci --omit=dev && \
            npm run build && \
            pm2 restart content-radar --update-env'

          echo "Deployed successfully"
