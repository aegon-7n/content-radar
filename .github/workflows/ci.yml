name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck + build
        run: npm run build
        env:
          DATABASE_URL: postgresql://ci@localhost:5432/ci
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: ci-secret
          ADMIN_EMAIL: ci@example.com
          ADMIN_PASSWORD: ci

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install scraper deps
        run: pip install -r scraper/requirements.txt

      - name: Syntax check all scraper modules
        run: python -m compileall scraper

  # smoke job убран 2026-05-31: api-smoke.sh читает BASE_URL из env,
  # а workflow передавал URL как $1 — скрипт его игнорировал и стучался
  # в localhost:3000 (которого в CI runner нет) → каждый push был красным
  # и спамил Глебу inbox. Smoke прогоняется руками:
  #   BASE_URL=https://app.contentradar.app bash qa/smoke/api-smoke.sh
