name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Verify required secrets are set
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          missing=()
          [ -z "$VPS_HOST" ]        && missing+=(VPS_HOST)
          [ -z "$VPS_USER" ]        && missing+=(VPS_USER)
          [ -z "$VPS_SSH_KEY" ]     && missing+=(VPS_SSH_KEY)
          [ -z "$VPS_DEPLOY_PATH" ] && missing+=(VPS_DEPLOY_PATH)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "ERROR: Missing GitHub Actions secrets: ${missing[*]}"
            echo "Go to: Settings -> Secrets and variables -> Actions -> New repository secret"
            echo "Required: VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_DEPLOY_PATH=/root/content-radar"
            exit 1
          fi
          echo "All secrets present -- proceeding with deploy"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Build runs on the GH Actions runner (7 GB RAM) — bypasses VPS memory constraint.
      # Env vars here are build-time only; Next.js reads runtime vars from .env.local on VPS.
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://placeholder@localhost/placeholder
          NEXTAUTH_URL: https://app.contentradar.app
          NEXTAUTH_SECRET: placeholder-ci-secret
          ADMIN_EMAIL: ci@placeholder.local
          ADMIN_PASSWORD: placeholder

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" | tr -d '\r' > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Pull code and run migrations on VPS
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/vps_key "$VPS_USER@$VPS_HOST" "
            set -e
            cd '$VPS_DEPLOY_PATH'
            git pull origin main
            npm ci
            npm run db:migrate
          "

      - name: Upload build artifacts to VPS
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          rsync -az --delete .next/ \
            -e "ssh -i ~/.ssh/vps_key" \
            "$VPS_USER@$VPS_HOST:$VPS_DEPLOY_PATH/.next/"

      - name: Reload app on VPS
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/vps_key "$VPS_USER@$VPS_HOST" "
            set -e
            cd '$VPS_DEPLOY_PATH'
            sed -i 's|^NEXTAUTH_URL=.*|NEXTAUTH_URL=https://app.contentradar.app|' .env.local
            pm2 reload content-radar --update-env
          "
